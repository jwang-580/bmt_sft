name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Registry and source-release tests
        run: python -m unittest discover -s tests -v
      - name: Research tests
        run: python -m unittest research_eval.test_research -v
      - name: Check source-release files
        run: python scripts/publication.py check
